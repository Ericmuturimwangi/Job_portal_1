<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ job.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-lg rounded-lg p-6 max-w-lg w-full">
        <h1 class="text-2xl font-bold text-blue-600 mb-3">{{ job.title }}</h1>
        <p class="text-gray-700"><strong>Company:</strong> {{ job.company }}</p>
        <p class="text-gray-700"><strong>Location:</strong> {{ job.location }}</p>
        <p class="text-gray-700"><strong>Description:</strong> {{ job.description }}</p>
        <p class="text-gray-500 text-sm"><strong>Posted On:</strong> {{ job.posted_at|date:"F d, Y" }}</p>

        {% if user.is_authenticated %}
            <a href="{% url 'apply_for_job' job.id %}" class="block bg-blue-600 text-white text-center py-2 rounded-lg mt-4 hover:bg-blue-700 transition">
                Apply Now
            </a>
        {% else %}
            <p class="text-center text-gray-600 mt-4">
                <a href="{% url 'login' %}" class="text-blue-600 font-medium hover:underline">Log in</a> to apply for this job.
            </p>
        {% endif %}
    </div>
</body>
</html>
