{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Job Applications</h2>

    <div class="overflow-x-auto bg-white shadow-md rounded-lg">
        <table class="w-full border-collapse border border-gray-200">
            <thead>
                <tr class="bg-gray-100 text-gray-700">
                    <th class="py-3 px-6 border-b">Candidate</th>
                    <th class="py-3 px-6 border-b">Job</th>
                    <th class="py-3 px-6 border-b">Resume</th>
                    <th class="py-3 px-6 border-b">Status</th>
                </tr>
            </thead>
            <tbody>
                {% for application in applications %}
                <tr class="hover:bg-gray-50">
                    <td class="py-3 px-6 border-b text-gray-800">{{ application.candidate.username }}</td>
                    <td class="py-3 px-6 border-b text-gray-800">{{ application.job.title }}</td>
                    <td class="py-3 px-6 border-b">
                        <a href="{{ application.resume.url }}" class="text-blue-500 hover:underline">
                            View Resume
                        </a>
                    </td>
                    <td class="py-3 px-6 border-b">
                        <span class="px-3 py-1 rounded-full text-sm 
                            {% if application.status == 'Pending' %} bg-yellow-200 text-yellow-800 
                            {% elif application.status == 'Accepted' %} bg-green-200 text-green-800 
                            {% else %} bg-red-200 text-red-800 {% endif %}">
                            {{ application.status }}
                        </span>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="py-4 px-6 text-center text-gray-500">
                        No applications available
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
